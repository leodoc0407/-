name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5                     # ✅ было @v4, стало @v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5                  # ✅ было @v4, стало @v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Upload built JAR
        uses: actions/upload-artifact@v6             # ✅ было @v4, стало @v6
        with:
          name: mod-jar
          path: build/libs/*.jar
